<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <rect width="1200" height="440" rx="20" fill="#FBFBF8" stroke="#DCDCD3" stroke-width="2"/>

  <!-- Header -->
  <text x="44" y="42" font-family="monospace" font-size="11" font-weight="700" fill="#3B52F6" letter-spacing="1.4">INTENT &amp; RISK TRAJECTORY GRAPH · SHOPPER #4821 (BLACK DENIM)</text>
  <text x="44" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#141413">Real-Time Purchase Intent vs. Drop-Off Risk Accumulation Across Session Events</text>

  <!-- Legend -->
  <g transform="translate(820, 32)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#3B52F6"/>
    <text x="22" y="12" font-family="monospace" font-size="11" font-weight="700" fill="#141413">Purchase Intent (%)</text>
    <rect x="175" y="0" width="14" height="14" rx="3" fill="#D6453A"/>
    <text x="197" y="12" font-family="monospace" font-size="11" font-weight="700" fill="#141413">Drop-Off Risk (%)</text>
  </g>

  <!-- Chart Grid Area -->
  <g transform="translate(80, 105)">
    <!-- Horizontal Grid Lines (100%, 75%, 50%, 25%, 0%) -->
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#E8E8E0" stroke-width="1"/>
    <text x="-14" y="4" text-anchor="end" font-family="monospace" font-size="11" fill="#6E6E68">100%</text>

    <line x1="0" y1="62" x2="1040" y2="62" stroke="#E8E8E0" stroke-width="1"/>
    <text x="-14" y="66" text-anchor="end" font-family="monospace" font-size="11" fill="#6E6E68">75%</text>

    <line x1="0" y1="125" x2="1040" y2="125" stroke="#E8E8E0" stroke-width="1"/>
    <text x="-14" y="129" text-anchor="end" font-family="monospace" font-size="11" fill="#6E6E68">50%</text>

    <line x1="0" y1="187" x2="1040" y2="187" stroke="#E8E8E0" stroke-width="1"/>
    <text x="-14" y="191" text-anchor="end" font-family="monospace" font-size="11" fill="#6E6E68">25%</text>

    <line x1="0" y1="250" x2="1040" y2="250" stroke="#DCDCD3" stroke-width="1.5"/>
    <text x="-14" y="254" text-anchor="end" font-family="monospace" font-size="11" fill="#6E6E68">0%</text>

    <!-- Autonomous Action Threshold Line (75%) -->
    <line x1="0" y1="62" x2="1040" y2="62" stroke="#3B52F6" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="1035" y="54" text-anchor="end" font-family="monospace" font-size="10" font-weight="700" fill="#3B52F6">AUTONOMOUS INTERVENTION THRESHOLD (75%)</text>

    <!-- Area Under Intent Curve -->
    <path d="M 40 190 L 200 145 L 360 78 L 520 48 L 680 58 L 840 22 L 1000 12 L 1000 250 L 40 250 Z" fill="#3B52F6" fill-opacity="0.08"/>

    <!-- Drop-Off Risk Line (Red) -->
    <!-- Points: 22:41:08 (20%), 22:41:31 (25%), 22:42:04 (22%), 22:43:19 (54%), 22:44:02 (78%), 22:45:17 (78%), 22:45:26 (18% after nudge) -->
    <polyline fill="none" stroke="#D6453A" stroke-width="2.5" stroke-dasharray="5 3"
      points="40,200 200,188 360,195 520,115 680,55 840,55 1000,205"/>

    <!-- Purchase Intent Line (Blue) -->
    <!-- Points: 22:41:08 (24%), 22:41:31 (42%), 22:42:04 (69%), 22:43:19 (81%), 22:44:02 (77%), 22:45:17 (91%), 22:45:26 (96% checkout) -->
    <polyline fill="none" stroke="#3B52F6" stroke-width="3.5"
      points="40,190 200,145 360,78 520,48 680,58 840,22 1000,12"/>

    <!-- Data Nodes & Labels -->
    <g transform="translate(40, 190)">
      <circle r="5.5" fill="#3B52F6"/>
      <text x="0" y="-12" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#141413">24%</text>
    </g>
    <g transform="translate(200, 145)">
      <circle r="5.5" fill="#3B52F6"/>
      <text x="0" y="-12" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#141413">42% (+18)</text>
    </g>
    <g transform="translate(360, 78)">
      <circle r="5.5" fill="#3B52F6"/>
      <text x="0" y="-12" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#141413">69% (+27)</text>
    </g>
    <g transform="translate(520, 48)">
      <circle r="5.5" fill="#3B52F6"/>
      <text x="0" y="-12" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#3B52F6">81% (+21)</text>
    </g>
    <g transform="translate(680, 55)">
      <circle r="6" fill="#D6453A"/>
      <text x="0" y="-14" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#D6453A">RISK 78%</text>
    </g>
    <g transform="translate(840, 22)">
      <circle r="8" fill="#3B52F6" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="-58" y="-36" width="116" height="22" rx="6" fill="#3B52F6"/>
      <text x="0" y="-21" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF">INTENT 91% · LOOP</text>
    </g>
    <g transform="translate(1000, 12)">
      <circle r="8" fill="#1F8A5C" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="-66" y="-34" width="132" height="22" rx="6" fill="#1F8A5C"/>
      <text x="0" y="-19" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF">NUDGE → RECOVERED</text>
    </g>

    <!-- X-Axis Event Timestamps -->
    <g transform="translate(0, 275)" font-family="monospace" font-size="10" fill="#141413" text-anchor="middle">
      <text x="40" y="0" font-weight="700">22:41:08</text>
      <text x="40" y="16" fill="#6E6E68">SEARCH</text>

      <text x="200" y="0" font-weight="700">22:41:31</text>
      <text x="200" y="16" fill="#6E6E68">VIEW (4×)</text>

      <text x="360" y="0" font-weight="700">22:42:04</text>
      <text x="360" y="16" fill="#6E6E68">ADD TO CART</text>

      <text x="520" y="0" font-weight="700">22:43:19</text>
      <text x="520" y="16" fill="#6E6E68">PRICE CHECK (3×)</text>

      <text x="680" y="0" font-weight="700" fill="#D6453A">22:44:02</text>
      <text x="680" y="16" fill="#D6453A">LEFT CART</text>

      <text x="840" y="0" font-weight="700" fill="#3B52F6">22:45:17</text>
      <text x="840" y="16" fill="#3B52F6">RETURNED (91%)</text>

      <text x="1000" y="0" font-weight="700" fill="#1F8A5C">22:45:26</text>
      <text x="1000" y="16" fill="#1F8A5C">₹3,899 NUDGE</text>
    </g>
  </g>
</svg>
